services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: relay
    volumes: [relay-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relay -d relay]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ['127.0.0.1:8000:8000']
    environment:
      DATABASE_URL: postgresql+psycopg://relay:${DB_PASSWORD}@db:5432/relay
      APP_ORIGIN: http://localhost:8000
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db: {condition: service_healthy}
volumes:
  relay-data:
